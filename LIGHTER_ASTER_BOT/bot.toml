# One Lighter/Aster bot for one market: the Aster-maker / Lighter-hedge engine ([maker],
# "XEMM") quotes, and when an arbitrage passes the taker-taker engine's entry gate ([taker]),
# XEMM pulls its quotes and the taker trades, then XEMM quotes again. [controller] holds the
# cross-engine loss stop. Every key is checked at startup; an unknown or misplaced key fails
# the load.
#
# Run with (the mode is a command-line choice only):
#   lighter_aster_bot run --config bot.toml --market HYPE --mode live
#   lighter_aster_bot run --config bot.toml --market HYPE --mode dry-run   # see [dry_run]
#
# The engines' own commands read their table of this file, e.g.
#   lighter_aster_bot taker run --config bot.toml --markets HYPE --observe-only

[controller]
poll_sec              = 15
# Cross-engine stop, inclusive: marked equity drawdown from the persisted baseline, or the
# realized PnL of both engines' trades (unverified gains never count). A trip writes
# runs/bot-<MARKET>.breaker.json; restart needs --ack-breaker (a drawdown trip also
# --reset-breaker-baseline).
max_loss_usdc          = "15"
baseline_max_gap_hours = 48

[taker.arb]
desired_notional = "13"
margin_bps = "2.0"
aster_taker_fee_bps = "4.0"
lighter_taker_fee_bps = "0.0"
# A market hedged on Hyperliquid pays this instead (the same fee as [maker.edge]'s).
hyperliquid_taker_fee_bps = "4.5"
max_aster_slippage_bps = "30.0"
max_lighter_slippage_bps = "30.0"
# Emergency (naked-leg recovery) bound: must be WIDER than the normal bounds — recovery
# fires exactly when the market has moved, and an IOC that can't cross a moved/thin book
# leaves the naked leg open through repeated attempts. (2.5x normal; XEMM uses 90 vs 60.)
emergency_slippage_bps = "75.0"
hedge_retry_slippage_bps = "30.0"
hedge_retry_timeout_ms = 5000
max_hedge_retry_attempts = 1
cooldown_ms = 60000
startup_warmup_ms = 15000
poll_interval_ms = 10
max_book_staleness_ms = 2000
max_recovered_failures_per_hour = 3
max_recovered_loss_usdc_per_hour = "0.25"

[taker.arb.depth_guard]
enabled = true
liquidity_multiple = "10"
max_levels = 20

[taker.arb.book_sanity]
enabled = true
interval_ms = 10000
max_top_bps = "8.0"
max_vwap_bps = "8.0"
required_failures = 2
required_successes = 2
block_cooldown_ms = 15000
rest_depth_levels = 20
liquidity_multiple = "10"

[taker.arb.entry_gate]
enabled = true
mode = "enforce"
history_window_hours = 72
sample_interval_ms = 1000
# Samples are recorded only for fee-clearing opportunities (~3/h on calm HYPE, 2026-09-24), so
# 500 in 72 h was unreachable: 50 still gates at the 90th percentile of recent history.
min_history_samples = 50
entry_percentile = "90"
min_extra_bps = "0.5"

[taker.pnl]
enabled = true
persist_dir = "runs"
since = "2026-06-23T23:00:00Z"
max_loss_usdc = "10"

[taker.live]
# The taker engine's arming switch: it refuses to start unless enabled and mode = "live".
enabled = true
mode = "live"
max_account_snapshot_age_ms = 30000

[taker.venues]
aster_base_url = "https://fapi.asterdex.com"
lighter_base_url = "https://mainnet.zklighter.elliot.ai"
signers_dir = "signers"

[taker.risk]
max_abs_position_notional_usd = "200"
max_position_mismatch_usd = "3"
margin_buffer_usd = "25"
min_reconcile_interval_ms = 500

[[taker.markets]]
market_id = "HYPE"
aster_symbol = "HYPEUSDT"
lighter_symbol = "HYPE"
lighter_market_index = 24
lighter_size_decimals = 2
lighter_price_decimals = 4
lighter_min_notional = "10"

[[taker.markets]]
market_id = "HYPE-HL"
aster_symbol = "HYPEUSDT"
lighter_symbol = "HYPE"
hedge_venue = "hyperliquid"

# Taker only: Lighter against Hyperliquid, with no Aster leg for XEMM to quote on. Each leg pays
# its own venue's fee: 0 + 4.5 + margin 2 = 6.5 bps of required edge.
[[taker.markets]]
market_id = "HYPE-LH"
first_venue = "lighter"
lighter_symbol = "HYPE"
lighter_market_index = 24
lighter_size_decimals = 2
lighter_price_decimals = 4
lighter_min_notional = "10"
hedge_venue = "hyperliquid"

[maker.edge]
# The required quoted edge is 14 + 1.5 + 2 + 1 = 18.5 bps above configured
# fees. This is an admission estimate; realized outcomes depend on fills and
# subsequent hedge prices. The loss breaker uses marked account equity.
min_net_profit_bps   = "14.0"
slippage_buffer_bps  = "1.5"
latency_buffer_bps   = "2.0"
basis_buffer_bps     = "1.0"
funding_buffer_bps   = "0.0"
aster_maker_fee_bps        = "0.0"
taker_fee_bps              = "0.0"
# The hedge fee of a market hedged on Hyperliquid (the account's userCrossRate, probe 2026-09-27).
hyperliquid_taker_fee_bps  = "4.5"

[maker.quote]
# $13 per side: > Lighter's $10 min and the $5 Aster min, <= the $15 small-risk cap.
desired_notional             = "13"
max_quote_distance_bps       = "50"
min_aster_touch_distance_bps = "18.0"
min_aster_touch_hysteresis_bps = "1.0" # re-arm at 19 bps
max_aster_touch_hysteresis_ms = 300000 # after 5m, fall back to the 18 bps base guard
depth_liquidity_multiple           = "10.0" # require 10x quote qty in visible depth for Lighter hedge VWAP and Aster effective touch
max_hedge_slippage_bps       = "5.0"
price_change_ticks_to_requote = 2
clamp_to_min_lot             = true
# Per-side requote deadband: skip a cancel/replace while the new desired price is within this many
# bps of the resting quote, once it has passed the profitability recheck. Suppresses sub-bps
# requote churn.
min_requote_bps              = "2.0"

[maker.capital]
aster_capital_usd       = "200"
lighter_capital_usd = "200"
leverage                = "1"
enforce_position_cap    = true

[maker.book_check]
enabled              = true
interval_secs        = 30
tolerance_bps        = "50"
consecutive_breaches = 3
depth_limit          = 20

[maker.live]
enabled                       = true
post_trade_cooldown_ms        = 3000
cooldown_scope                = "per_market"
startup_cancel_all            = true
shutdown_cancel_all           = true
require_clean_start           = true
max_unhedged_notional_usd     = "15"         # allow one $13 clip in flight before freezing NEW quotes
max_unhedged_age_ms           = 8000         # generous: a slow-network hedge RTT must not false-freeze
max_position_mismatch_usd     = "3"
max_account_snapshot_age_ms   = 4000
max_user_stream_staleness_ms  = 15000        # slow dev network
max_book_staleness_ms         = 10000
cancel_all_on_gate_close      = true
cancel_all_on_user_stream_stale = true

[maker.live.quote]
use_hot_integer_math               = true
# false: quote both sides, each fill hedged at once (Hummingbot's XEMM), within [maker.capital].
# true: once cross-venue inventory exists, only post the side whose Lighter hedge reduces it.
reduce_position_only               = false
replace_immediately_if_unprofitable = true
min_requote_interval_ms            = 150
# Live safety cap for per-symbol replace churn. The separate Aster command budget below protects
# the global REST write path and reserves room for cancels/sweeps.
max_replaces_per_minute_per_symbol = 100

[maker.live.partials]
# Accumulate sub-minimum maker fills until hedgeable. Expired/oversized residuals
# enter tracked, rounded-down reduce-only correction (at most two attempts).
# Quantization remainders and ambiguous orders remain reserved and explicit.
policy                  = "accumulate_sub_min"
max_pending_notional_usd = "15"
max_pending_age_ms       = 6000
lighter_min_notional     = "10"

[maker.live.aster]
base_url             = "https://fapi.asterdex.com"
deadman_enabled      = true
deadman_countdown_ms = 10000
deadman_refresh_ms   = 2000
max_rest_requests_per_minute      = 1200
optional_rest_reserve_per_minute  = 120
cancel_retry_backoff_ms           = 1000
safety_sweep_retry_ms             = 2000
rate_limit_backoff_ms             = 5000

[maker.live.lighter]
base_url              = "https://mainnet.zklighter.elliot.ai"
signers_dir           = "signers"
# IOC limit bounds adverse execution; fresh remaining quantities govern any retry.
normal_slippage_bps   = "60"
emergency_slippage_bps = "90"
fill_timeout_ms       = 2000

[maker.live.margin_guard]
# Opening capacity is bounded by the static 1x cap and actual free margin on
# each venue after buffers and outstanding directional obligations. Reductions
# remain eligible. Requires leverage=1 and enforce_position_cap=true.
enabled                 = true
aster_safety_buffer_usd = "26"
lighter_safety_buffer_usd = "26"

[maker.live.circuit_breaker]
# Unattended-run safety stop. Measures TOTAL cross-venue marked equity (Aster wallet+unrealized + Lighter
# portfolio value + marked uPnL) vs a baseline = median of the first 5 fresh samples; if the drawdown
# exceeds the limit on 3 consecutive fresh samples the bot cancels orders, LEAVES the delta-neutral
# position open, writes runs/bot-<MARKET>.trip.json, and halts. It then REFUSES to restart until the
# latch is cleared:  python scripts/reset_breaker.py --coin <MARKET> --archive
enabled                  = true
max_cumulative_loss_usdc = "10"

[[maker.markets]]
aster_symbol = "HYPEUSDT"
lighter_symbol      = "HYPE"

# HYPE hedged on Hyperliquid; its own lock, journal and simulated state by market id.
[[maker.markets]]
market_id    = "HYPE-HL"
aster_symbol = "HYPEUSDT"
lighter_symbol = "HYPE"
hedge_venue  = "hyperliquid"

[[maker.markets]]
aster_symbol = "BNBUSDT"
lighter_symbol      = "BNB"

[[maker.markets]]
aster_symbol = "ETHUSDT"
lighter_symbol      = "ETH"

# `--mode dry-run`: the same bot, signing with a dry-run identity no venue knows, against its
# market's two venues simulated on loopback. Live market data feeds them as a bot in AWS
# Tokyo (ap-northeast-1) would see it; files go to runs/dry-run/. Latencies are [p50, p99] ms,
# drawn lognormal. Fees and leverage are the engines' own keys above.
[dry_run]
# The simulated world is the real one delayed by shift_ms. Every frame must reach this host in
# under shift_ms minus the 250 ms lookahead that matches takers against the worse of the two book
# states around them. Measured here in Docker on 2026-09-24 (sim-<M>.diag.jsonl `lag_ms`): book
# p50 ~200 ms, p99 ~390 ms; trades p99 up to ~620 ms. The shift itself is invisible to the bot.
shift_ms = 1000
seed     = 0
aster_port       = 18081
lighter_port     = 18082
hyperliquid_port = 18083
aster_balance_usdt   = "200"
lighter_balance_usdc = "200"
# A request takes effect at this fraction of its round trip; 0.9 puts most of the latency before
# matching (pessimistic until live acks calibrate it).
effect_fraction = 0.9
# latency.perps.trading benchmark from AWS Tokyo apne1-az4, 2026-09-23: post-only submit to
# confirmation (Aster cancel p50 96).
aster_rest_rtt_ms = [101, 164]
lighter_rtt_ms    = [8, 36]
# Lighter docs, account types: a Standard account's taker orders wait 300 ms (Premium 140).
lighter_taker_delay_ms = 300
# Estimates above the benchmark's network floors (Aster 0.4 ms, Lighter 2.9 ms); calibrate.
aster_feed_ms        = [5, 30]
lighter_feed_ms      = [5, 30]
aster_user_stream_ms = [10, 50]
lighter_account_ms   = [5, 30]
# Hyperliquid (its account starts with lighter_balance_usdc and follows lighter_account_ms).
# Hyperliquid states a 0.2 s median end to end (one block) from Tokyo; from this host an IOC took
# ~0.9 s with the network to Tokyo (probe 2026-09-27). Its feed is an estimate; calibrate both.
hyperliquid_rtt_ms  = [200, 500]
hyperliquid_feed_ms = [5, 30]
# Hidden size ahead of us at our price, as a multiple of the visible size (Aster offers a HIDDEN
# time in force); calibrate from the prints the visible book cannot explain.
hidden_queue_multiplier = "0.5"
