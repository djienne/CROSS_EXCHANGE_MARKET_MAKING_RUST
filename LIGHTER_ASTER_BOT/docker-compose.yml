# Aster/Lighter bot: `run` holds the XEMM engine and the taker-taker engine for one market;
# XEMM hands the execution rights to the taker for each arbitrage.
#
# One Dockerfile, two tags: lighter_aster_bot:live and :dryrun. Secrets are mounted read-only,
# never baked. The runs/ dir (journals, ledgers, latches, controller state) is a persistent
# bind mount.
#
# `docker compose build` / `up -d` touch only `dryrun`, `dryrun-hl` and `dryrun-lh`, the same bot
# against simulated venues (no credentials, files in runs/dry-run/, image lighter_aster_bot:dryrun;
# `dryrun-hl` trades HYPE-HL, hedged on Hyperliquid; `dryrun-lh` HYPE-LH, taker only on Lighter
# against Hyperliquid), and `recorder`, the
# market-data tape for backtests (public data only, files in data/). The real-money
# `bot` service sits behind the `live` profile: only a command naming it builds or starts it,
# so never set COMPOSE_PROFILES=live here.
#
# ---- Dry run (safe unattended; the fleet's start_all.bat starts it) ---------------
#   docker compose up -d --build dryrun dryrun-hl dryrun-lh
#   docker compose logs -f dryrun
#   docker compose restart dryrun     # after a halt: the restart is the review
#
# ---- Live, here or on a Linux host (RUNBOOK.md: going live, run and stop, probes) ---
#   docker compose --profile live build bot
#   docker compose --profile live run --rm bot probe aster-balance   # signed reads, no orders
#   # REAL MONEY, detached; the stopped container keeps its log (docker logs bot-hype):
#   docker compose --profile live run -d --name bot-hype bot run --market HYPE --mode live
#   docker kill --signal=SIGINT bot-hype              # graceful drain; paired positions stay open
#   docker rm bot-hype                                # after reviewing its log
# -----------------------------------------------------------------------------------

services:
  bot:
    profiles: ["live"]
    build:
      context: .
      dockerfile: Dockerfile
    image: lighter_aster_bot:live
    working_dir: /app
    user: "${XEMM_UID:-1000}:${XEMM_GID:-1000}"
    environment:
      ASTER_NONCE_DIR: /nonce
      ASTER_ENV_PATH: /run/creds/aster.env
      LIGHTER_ENV_PATH: /run/creds/lighter.env
      HYPERLIQUID_ENV_PATH: /run/creds/hyperliquid.env
    # Docker Desktop shows Windows bind mounts as mode 777, which `run --mode live` refuses for
    # credentials. The bot reads 0600 copies in a memory-only tmpfs of its own user instead;
    # the check itself stays.
    tmpfs:
      - /run/creds:mode=0700,uid=${XEMM_UID:-1000},gid=${XEMM_GID:-1000}
    entrypoint: ["sh", "-c", "for f in aster lighter hyperliquid; do [ ! -e /app/$$f.env ] || install -m 600 /app/$$f.env /run/creds/; done; exec lighter_aster_bot \"$$@\"", "lighter_aster_bot"]
    volumes:
      # Mount the WHOLE deploy dir read-only at the working dir, so bot.toml, the signer
      # binaries and the secret env files (aster.env / lighter.env / hyperliquid.env) are
      # present — no per-file mounts to keep in sync. The binary lives in /usr/local/bin,
      # so this never shadows it; secrets are still mount-only (never in the image).
      - .:/app:ro
      # Persistent + WRITABLE outputs; this nested mount overrides the read-only parent
      # for the runs/ subtree only.
      - ./runs:/app/runs
      # The retired orchestrator's runs/ at the stack root: `run --mode live` refuses to start
      # while its lock is held or its latches exist (RUNBOOK.md, "Orchestrator leftovers").
      - ../runs:/runs:ro
      # One counter for every container signing for the Aster wallet: the live bot and the
      # probes beside it. On a Linux host, set ASTER_NONCE_DIR to share it with native signers.
      - ${ASTER_NONCE_DIR:-aster-nonce}:/nonce
    # SIGINT, SIGTERM and SIGHUP all start the same graceful drain. Positions stay OPEN.
    stop_signal: SIGINT
    # A status tick in progress (<= 50 s), then XEMM's and the taker's stops,
    # each capped at 200 s (ENGINE_STOP_TIMEOUT in src/controller/supervisor.rs); a shorter
    # grace SIGKILLs a legitimate drain and leaves fills unhedged.
    stop_grace_period: 460s
    # A halt must stay halted until an operator reviews it; never auto-restart.
    restart: "no"
    # Default = print help and exit; real runs override the command per invocation.
    command: ["--help"]
    # As the dry run's; HELPERS\cpu_limits excludes the `bot` service, so this value stands.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The same bot against simulated Aster and Lighter venues fed by live public market data
  # (RUNBOOK.md, "Dry run"). No credentials are mounted, and its dry-run identity signs for
  # no real account.
  dryrun: &dryrun
    build:
      context: .
      dockerfile: Dockerfile
    # Its own tag: the fleet's start_all.bat rebuilds this from the working tree, which must
    # never retag the live image.
    image: lighter_aster_bot:dryrun
    container_name: lighter-aster-dryrun
    working_dir: /app
    user: "${XEMM_UID:-1000}:${XEMM_GID:-1000}"
    # Only what the dry run reads and writes; the Aster nonce counter stays in the
    # container's /tmp (the nonces are clock-based, so a fresh counter is safe).
    volumes:
      - ./bot.toml:/app/bot.toml:ro
      - ./signers:/app/signers:ro
      - ./runs/dry-run:/app/runs/dry-run
    # A halted dry run parks instead of exiting, so this policy cannot loop on a halt. Every
    # start acknowledges the halt, a reboot's too; it stays in the event log (RUNBOOK.md).
    command: ["run", "--market", "HYPE", "--mode", "dry-run", "--ack-breaker"]
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 460s
    # A latency simulator must not be CFS-throttled, and the quota also sizes the tokio worker
    # pool: 2 CPUs is ~100x the ~2 % of one core measured, a ceiling against a runaway only.
    # The value is the fleet policy's override (HELPERS\cpu_limits); cpu_limits.bat keeps it.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The same dry run on HYPE-HL: Aster against a simulated Hyperliquid instead of Lighter.
  dryrun-hl:
    <<: *dryrun
    container_name: lighter-aster-dryrun-hl
    command: ["run", "--market", "HYPE-HL", "--mode", "dry-run", "--ack-breaker"]
    # Declared again: cpu_limits.bat keeps each service's own `cpus`.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  # HYPE-LH: the taker alone, Lighter against Hyperliquid (no Aster leg, so no XEMM).
  dryrun-lh:
    <<: *dryrun
    container_name: lighter-aster-dryrun-lh
    command: ["run", "--market", "HYPE-LH", "--mode", "dry-run", "--ack-breaker"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  # Records HYPE's raw public Aster and Lighter feeds, the dry run's input (Aster 20-level book,
  # best bid/ask and trades; Lighter book updates, trades and funding), to data/HYPE/ for
  # backtests (RUNBOOK.md, "Market data tape"). Its own process and image tag: it never slows
  # the bot, and rebuilding the dry run does not interrupt it. No credentials, no orders.
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    image: lighter_aster_bot:recorder
    container_name: lighter-aster-recorder
    working_dir: /app
    user: "${XEMM_UID:-1000}:${XEMM_GID:-1000}"
    volumes:
      - ./bot.toml:/app/bot.toml:ro
      - ./data:/app/data
    command: ["record", "--market", "HYPE"]
    restart: unless-stopped
    stop_signal: SIGINT
    # Arrival times are the tape's record of feed latency, so CFS throttling would stamp them
    # late. The value is the fleet policy's override (HELPERS\cpu_limits); cpu_limits.bat keeps it.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # The live Aster nonce counter (`bot` service); it takes the image's /nonce owner.
  aster-nonce:
