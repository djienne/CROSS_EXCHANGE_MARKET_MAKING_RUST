[package]
name = "lighter_aster_bot"
version = "0.1.0"
edition = "2021"
# Keep the supported compiler aligned with the container and release checks.
rust-version = "1.92"
default-run = "lighter_aster_bot"
description = "Aster/Lighter/Hyperliquid bot: XEMM maker/hedger and taker-taker arbitrage"

[lib]
name = "lighter_aster_bot"
path = "src/lib.rs"

[[bin]]
name = "lighter_aster_bot"
path = "src/main.rs"

[dependencies]
arrayvec = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
# Unknown-key rejection for file-loaded configs (bot.toml).
serde_ignored = "0.1"
rust_decimal = { version = "1", features = ["serde-str"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libloading = "0.8"
# --- lock-free real-time substrate (latest-book cells, cancellation, core pinning) ---
arc-swap = "1"
tokio-util = "0.7"
core_affinity = "0.8"
# --- live signing (Aster EIP-712) ---
# secp256k1 ECDSA with recoverable signatures (EIP-712 'v'); keccak256; hex for r/s
# serialization; fs2 + memmap2 for the cross-process Aster nonce counter.
k256 = { version = "0.13", features = ["ecdsa"] }
tiny-keccak = { version = "2", features = ["keccak"] }
# Hyperliquid signs the MessagePack of each action.
rmp-serde = "1"
hex = "0.4"
fs2 = "0.4"
memmap2 = "0.9"
# The market-data tape (`record`).
zstd = "0.13"

[dev-dependencies]
# test-util enables tokio::test(start_paused) for deterministic timer tests on the
# hedge fill-wait path.
tokio = { version = "1", features = ["full", "test-util"] }

# NOTE: no `panic = "abort"` here: livebot/run.rs relies on catch_unwind to report a
# strategy-thread panic through the supervision channel and shut down through the
# order-cancelling cleanup path. Abort would skip that. `taker` and `run` restore
# abort-on-panic for every other thread through a panic hook (`taker::abort_on_panic`).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
